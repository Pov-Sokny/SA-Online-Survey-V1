services:
  frontend:
    container_name: 'sa-frontend'
    image: ${DOCKER_USER}/survey-frontend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Note: This is still good for server-side calls, 
      # but build-args handled the client-side calls.
      - NEXT_PUBLIC_API_URL=https://sa-api.supersurvey.live/api/v1
    networks:
      - survey-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  survey-network:
    external: true
    # Use the EXACT name from your API project's network
    # Run 'docker network ls' on your VM to find the real name
    name: sa_online_survey_api_survey-network

